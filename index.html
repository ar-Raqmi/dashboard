<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#232A2E" />
    <meta name="description" content="Raqmi, a calmer personal workspace. Tasks, goals, notes, and daily rhythms in Everforest." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%232D353B'/%3E%3Cpath d='M12 37 34 11M16 31C10 16 21 7 38 7c-1 17-10 28-22 24Z' fill='none' stroke='%23D3C6AA' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;family=JetBrains+Mono:wght@400..600&amp;display=swap" rel="stylesheet" />
    <title>Raqmi</title>
    <script>try{var t=localStorage.getItem('raqmi-theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}else if(window.matchMedia('(prefers-color-scheme: light)').matches){document.documentElement.dataset.theme='light';document.documentElement.style.colorScheme='light';}}catch(e){}</script>
  </head>
  <body>
    <noscript>Raqmi needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
