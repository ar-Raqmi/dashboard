<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #EFEBD4; --fg: #5C6A72; --muted: #8A968A; }
      @media (prefers-color-scheme: dark) { :root { --bg: #232A2E; --fg: #D3C6AA; --muted: #7A8478; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 18px 0 6px; }
      p { margin: 0 0 20px; color: var(--muted); }
      button { font: inherit; padding: 9px 18px; border-radius: 8px; border: 1px solid currentColor; background: none; color: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Your workspace needs a connection. It will pick up where you left off.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
